<template>
    <lightning-card icon-name="standard:quote">
        <h3 class="slds-text-heading_medium slds-text-align_center">
            Create Quote in Different Currency - [Current Quote Currency : {currentQuoteCurrency}]
        </h3>
        <div class="slds-p-around_medium">
            <template if:false={isLoading}>
                <!-- Opportunity Name -->
                <lightning-input
                    label="Opportunity Name"
                    value={opportunityName}
                    onchange={handleOpportunityNameChange}
                    required
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Quote Name -->
                <lightning-input
                    label="Quote Name"
                    value={quoteName}
                    onchange={handleQuoteNameChange}
                    required
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Currency Selection -->
                <lightning-combobox
                    name="currency"
                    label="Select Currency"
                    value={selectedCurrency}
                    placeholder="Choose a currency"
                    options={currencyOptions}
                    onchange={handleCurrencyChange}
                    required
                    class="slds-m-bottom_small">
                </lightning-combobox>

                <!-- Exchange Rate -->
                <lightning-input
                    type="number"
                    label="Exchange Rate for Manual Item/Options"
                    value={exchangeRate}
                    onchange={handleExchangeRateChange}
                    disabled={isExchangeRateDisabled}
                    step="any"
                    min="0"
                    placeholder="Manual Item/Option * Your Provided Exchange Rate"
                    required
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Dynamic Calculation Example -->
                <template if:false={isExchangeRateDisabled}>
                    <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_small">
                        <p class="slds-text-body_small">
                            <strong>Example:</strong> 1000 × <strong>{exchangeRate}</strong>
                        </p>
                        <p class="slds-text-body_small">
                            <strong>Result:</strong> <span class="slds-text-color_success"><strong>{calculatedResult}</strong></span>
                        </p>
                    </div>
                </template>

                <template if:true={isExchangeRateDisabled}>
                    <p class="slds-text-color_weak slds-text-body_small slds-m-bottom_medium">
                        Exchange rate is disabled (no manual items or options in this quote)
                    </p>
                </template>

                <!-- Action Buttons -->
                <div class="slds-m-top_large">
                    <lightning-button
                        variant="brand"
                        label="Save"
                        title="Create Quote with Selected Currency"
                        onclick={handleSave}
                        disabled={isSaveDisabled}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        title="Cancel and Go Back"
                        onclick={handleCancel}>
                    </lightning-button>
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-is-relative" style="height: 100px;">
                    <lightning-spinner
                        alternative-text="Processing"
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
