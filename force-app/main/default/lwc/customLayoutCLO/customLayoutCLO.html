<template>
    <div class={sectionClass} data-section-id={sectionId}>
        <!-- Header -->
        <h3 class="slds-section__title">
            <button 
                type="button" 
                class="slds-button slds-section__title-action" 
                onclick={toggleSection}
            >
                <lightning-icon 
                    icon-name={chevronIconName} 
                    size="x-small"
                    class="slds-m-right_x-small {iconClass}"
                ></lightning-icon>
                <span class="slds-truncate">{label}</span>
            </button>
        </h3>
        
        <!-- Content (conditionally rendered) -->
        <template if:true={isOpen}>
            <div class="slds-section__content slds-p-around_medium">
                <lightning-record-form
                    record-id={recordId}
                    object-api-name={objectApiName}
                    fields={fields}
                    mode="readonly"
                    columns="3"
                >
                </lightning-record-form>
            </div>
        </template>
    </div>
</template>
