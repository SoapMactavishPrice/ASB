<template>
    <template if:true={showModal}>
        <lightning-card>
            <h3 class="slds-text-heading_medium slds-text-align_center">
                Recalculate Quote Price
            </h3>
            <div class="slds-p-around_medium">
                
                <template if:true={isLoading}>
                    <div class="slds-is-relative" style="height: 100px;">
                        <lightning-spinner
                            alternative-text="Loading"
                            size="medium">
                        </lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <template if:true={hasError}>
                        <div class="slds-m-bottom_medium">
                            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                <span class="slds-assistive-text">error</span>
                                <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small">
                                    <lightning-icon icon-name="utility:error" alternative-text="error" size="x-small" variant="inverse"></lightning-icon>
                                </span>
                                <h2>{errorMessage}</h2>
                            </div>
                        </div>
                    </template>

                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="pricebook-select">
                            <abbr class="slds-required" title="required">* </abbr>
                            Select Pricebook
                        </label>
                        <div class="slds-form-element__control">
                            <lightning-combobox
                                name="pricebook"
                                label=""
                                value={selectedPricebookId}
                                placeholder="Select a Pricebook"
                                options={pricebookOptions}
                                onchange={handlePricebookChange}
                                required
                                variant="label-hidden"
                                class="slds-m-bottom_small">
                            </lightning-combobox>
                        </div>
                    </div>

                <div class="slds-m-top_medium">
                    <div class="slds-box slds-theme_shade slds-p-around_small">
                        <p class="slds-text-body_small">
                            <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                            <b>This will recalculate all Quote Line Items and Options based on the selected pricebook.</b>
                            
                            <b>The Quote's pricebook will be updated to your selection.</b>
                            
                            <span class="slds-text-color_error slds-show_block slds-m-top_xx-small">
                            <b>Manual Item / Options prices are not changed.</b>
                            </span>
                        </p>
                    </div>
                </div>

                    <!-- Action Buttons -->
                    <div class="slds-m-top_large">
                        <lightning-button
                            variant="brand"
                            label="OK"
                            title="Recalculate Quote Price"
                            onclick={handleRecalculate}
                            disabled={isOkDisabled}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            title="Cancel"
                            onclick={handleCancel}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </template>
            </div>
        </lightning-card>
    </template>
</template>
